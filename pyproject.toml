[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "theia-mcr-iq-gui"
version = "4.0.0"
description = "Theia Technologies MCR IQ lens motor control: GUI and command-line tool"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license"]
requires-python = ">=3.11"
authors = [{ name = "Mark Peterson", email = "mpeterson@theiatech.com" }]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = ["FreeSimpleGUI>=5.1", "TheiaMCR>=3.4.2,<4", "pyserial>=3.5"]

[project.scripts]
theia-mcr-gui = "theia_mcr_iq.gui.app:main"
theia-mcr = "theia_mcr_iq.cli:main"

[project.urls]
Upstream = "https://github.com/cliquot22/Theia_MCR-IQ_GUI"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.8", "ty"]

[tool.hatch.build.targets.wheel]
packages = ["src/theia_mcr_iq"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
